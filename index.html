<style>
  :root{
    --bg:#000;
    --ink:#d6d6df;
    --dim:#5d5d6b;
    --faint:#2a2a33;
    --line:#16161c;
    --rose:#ff4d6d;
    --px:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
    --vt:'VT323', ui-monospace, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--vt);-webkit-font-smoothing:none;font-smooth:never}

  .app{height:100vh;height:100dvh;max-width:860px;margin:0 auto;display:flex;flex-direction:column;position:relative}

  /* ---- stage (canvas + HUD) ---- */
  .stage{position:relative;flex:1 1 60%;min-height:0;overflow:hidden}
  .stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 55% 45% at 50% 46%, rgba(150,10,45,.16), transparent 70%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .hud{position:absolute;font-family:var(--px);font-size:7px;line-height:2;color:var(--dim);letter-spacing:.02em;pointer-events:none;text-transform:lowercase}
  .hud b{font-weight:400;color:#8b8b9b}
  .hud-tr{top:calc(env(safe-area-inset-top,0px) + 16px);right:14px;display:flex;align-items:center;gap:7px;color:#9a9aa8}
  .dot{width:5px;height:5px;background:var(--rose);border-radius:50%;box-shadow:0 0 8px var(--rose);animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.25}}
  .hud-bl{left:14px;bottom:10px}

  .ctrl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;display:flex;gap:6px}
  .ctrl button{font-family:var(--px);font-size:7px;color:var(--dim);background:rgba(0,0,0,.4);border:1px solid var(--faint);
    padding:7px 8px;cursor:pointer;text-transform:lowercase;letter-spacing:.04em;transition:color .15s,border-color .15s}
  .ctrl button:hover,.ctrl button:focus-visible{color:var(--ink);border-color:#55555f;outline:none}
  .ctrl button[aria-pressed="true"]{color:var(--rose);border-color:#5a1f2c}

  /* ---- status bar ---- */
  .status{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-family:var(--px);font-size:8px;color:var(--dim);background:#030305}
  .status .cmd{color:#e8e8f0}
  .status .cmd i{font-style:normal;color:var(--rose);margin-right:6px}
  .status .run{display:flex;align-items:center;gap:7px}
  .status .run .dot{width:4px;height:4px;animation:none;opacity:1}

  /* ---- code ---- */
  .code{position:relative;flex:1 1 36%;min-height:150px;overflow:hidden;background:#020204}
  .code::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;z-index:2;pointer-events:none;
    background:linear-gradient(#020204,rgba(2,2,4,0))}
  .lines{position:absolute;left:0;right:0;bottom:0;top:0;overflow:hidden;padding:10px 0 12px;
    display:flex;flex-direction:column;justify-content:flex-end}
  .ln{display:flex;font-size:clamp(14px,3.9vw,19px);line-height:1.2;color:#c7c7d3;white-space:pre;min-height:1.2em}
  .ln i{flex:none;width:44px;padding-right:14px;text-align:right;color:#34343f;font-style:normal;border-left:2px solid transparent}
  .ln.cur{background:linear-gradient(90deg,rgba(255,70,100,.16),rgba(255,70,100,0) 70%)}
  .ln.cur i{border-left-color:var(--rose);color:#ff7d95}
  .k{color:#ff7fa8}.b{color:#78d0ff}.f{color:#ffd479}.n{color:#ffa066}.s{color:#a3d977}.c{color:#4e4e5f}.u{color:#bb9af7}
  .caret{display:inline-block;width:.55em;height:1em;background:var(--rose);vertical-align:-.12em;margin-left:1px;animation:blink 1s steps(2,jump-none) infinite}

  /* ---- gate ---- */
  #gate{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;
    transition:opacity .9s ease, visibility .9s}
  #gate.off{opacity:0;visibility:hidden;pointer-events:none}
  .gate-in{text-align:center;padding:24px}
  .gate-in .t1{font-family:var(--px);font-size:11px;color:#e8e8f0;margin:0 0 34px;letter-spacing:.03em}
  .gate-in .t1 span{color:var(--rose)}
  #go{font-family:var(--px);font-size:9px;color:#fff;background:transparent;border:1px solid #6a2434;padding:15px 20px;cursor:pointer;
    letter-spacing:.08em;position:relative;transition:background .2s,border-color .2s,box-shadow .2s}
  #go:hover,#go:focus-visible{background:rgba(255,77,109,.1);border-color:var(--rose);box-shadow:0 0 28px rgba(255,77,109,.25);outline:none}
  .gate-in .t2{font-family:var(--px);font-size:7px;color:var(--dim);margin:26px 0 0;line-height:2}

  @media (min-width:700px){
    .hud{font-size:8px}
    .ctrl button{font-size:8px}
    .status{font-size:9px;height:38px}
  }
  @media (max-height:520px){
    .code{flex-basis:30%;min-height:90px}
  }
  noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#aaa;font-family:monospace;z-index:30}

<script>
(() => {
'use strict';

/* =========================================================
   CONFIG — edit these
   ========================================================= */
const CONFIG = {
  handle: '@dineahmed05',   // shown bottom-left on the canvas
  year: '2026',
  script: 'thorns.py',      // shown in the status bar
  audioFile: '',            // optional: 'music.mp3' to use your own track instead of the built-in synth
  volume: 0.85
};

const qs=new URLSearchParams(location.search);
const { sin, cos, sqrt, abs, min, max, pow, floor, round, PI } = Math;
const TAU = PI * 2;
const $ = id => document.getElementById(id);

/* =========================================================
   small vector helpers
   ========================================================= */
const V = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{const l=sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]}
};
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261105);

/* =========================================================
   classes (colour families) and glyph ramps
   ========================================================= */
const CLS = { PETAL:0, DRY:1, STEM:2, THORN:3, LEAF:4, LEAFDRY:5, FLASH:6, DUST:7 };
const NCLS = 8;
const LV = 14;
const RAMPS = [
  [[0,[26,0,6]],[.55,[190,16,48]],[.85,[255,72,98]],[1,[255,205,212]]],      // petal
  [[0,[18,4,6]],[.55,[132,44,34]],[.85,[205,112,82]],[1,[240,190,150]]],      // dry petal
  [[0,[4,18,8]],[.6,[44,140,78]],[.9,[120,215,150]],[1,[215,255,225]]],       // stem
  [[0,[28,26,24]],[.6,[205,196,180]],[1,[255,255,255]]],                      // thorn (bone)
  [[0,[6,22,10]],[.6,[64,150,66]],[.9,[150,220,120]],[1,[225,255,205]]],      // leaf
  [[0,[26,16,6]],[.6,[160,112,44]],[.9,[225,180,98]],[1,[250,226,170]]],      // dry leaf
  [[0,[90,90,95]],[1,[255,255,255]]],                                         // flash
  [[0,[26,26,34]],[1,[190,190,210]]]                                          // dust
];
const CHARS_A = [' ','.',',',':',';','i','l','t','o','x','e','8','#','@'];
const CHARS_B = [' ','`',"'",'-','~','+','r','s','c','z','a','0','%','&'];

function rampColor(stops,b){
  for(let i=1;i<stops.length;i++){
    if(b<=stops[i][0]){
      const [t0,c0]=stops[i-1],[t1,c1]=stops[i];
      const f=(b-t0)/(t1-t0||1);
      return [c0[0]+(c1[0]-c0[0])*f,c0[1]+(c1[1]-c0[1])*f,c0[2]+(c1[2]-c0[2])*f];
    }
  }
  return stops[stops.length-1][1];
}

/* =========================================================
   geometry — everything is a cloud of points with normals
   ========================================================= */
const GOLD = TAU * 0.381966;
const BS = 1.32;   // bloom scale
const NPET = 22;

const P = {x:[],y:[],z:[],nx:[],ny:[],nz:[],cls:[],ta:[],ao:[],fl:[],pc:[]};
function add(p,n,cls,ta,ao=1,fl=0,pc=-1){
  P.x.push(p[0]);P.y.push(p[1]);P.z.push(p[2]);
  P.nx.push(n[0]);P.ny.push(n[1]);P.nz.push(n[2]);
  P.cls.push(cls);P.ta.push(ta);P.ao.push(ao);P.fl.push(fl);P.pc.push(pc);
}

// generic parametric surface sampler (normals by finite differences)
function surface(fn, rows, nvMax, widthFn, cb){
  const e = 0.012;
  for(let i=0;i<rows;i++){
    const u=(i+0.15+rnd()*0.7)/rows;
    const nv=max(2,round(nvMax*widthFn(u)));
    for(let j=0;j<nv;j++){
      const v=((j+0.15+rnd()*0.7)/nv)*2-1;
      const p=fn(u,v);
      const pu=V.sub(fn(u+e,v),fn(u-e,v));
      const pv=V.sub(fn(u,v+e),fn(u,v-e));
      let n=V.cross(pu,pv); const l=V.len(n);
      if(!(l>1e-9)) continue;
      cb(p,[n[0]/l,n[1]/l,n[2]/l],u,v);
    }
  }
}

const petalShape = u => {
  u=min(1.02,max(0,u));
  const base=sqrt(u)*0.9+0.1*u;
  const tip=u<0.72?1:sqrt(max(0,1-pow((u-0.72)/0.3,2)));
  return base*tip;
};
const leafShape = u => pow(max(0,sin(PI*min(1,pow(max(0,u),0.8)))),0.9);

function petalFn(k, frame){
  const t=k/(NPET-1);
  const ang=k*GOLD+0.4;
  const b=0.03+0.17*pow(t,0.8);
  const y0=0.02+0.05*(1-t);
  const L=0.3+0.3*pow(t,0.9);
  const wilt=k>=NPET-4?0.3+0.28*(k-(NPET-4)):0;       // the last petals bow down
  const lean=0.2+1.0*pow(t,1.3)+wilt;
  const a0=0.05+0.3*t;
  const span=2.4-1.0*t;
  return (u,v)=>{
    u=max(0,u);
    const al=a0+lean*u;
    const sh=petalShape(u);
    let rho=b+L/lean*(cos(a0)-cos(al));
    let y=y0+L/lean*(sin(al)-sin(a0));
    const ruf=0.03*u*u*sin(7*v*sh+k*1.9)*(0.25+t);
    rho+=ruf*0.6; y+=ruf;
    const th=ang+v*(span/2)*sh;
    return frame(rho*cos(th)*BS, y*BS, rho*sin(th)*BS);
  };
}

const PIECES = [];     // falling petals
let FLOOR_Y = -1.6, BLOOM_C = [0,0,0];

function build(){
  /* ---------- stem ---------- */
  const ctrl=[[-0.22,-1.55],[-0.16,-0.95],[-0.06,-0.35],[0.06,0.18],[0.28,0.55],[0.56,0.68],[0.80,0.54],[0.92,0.26]];
  const nSeg=ctrl.length-1;
  const cr=(a,b,c,d,t)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  const stemPos=s=>{
    s=min(1,max(0,s)); const f=s*nSeg; const i=min(nSeg-1,floor(f)); const t=f-i;
    const p0=ctrl[max(0,i-1)],p1=ctrl[i],p2=ctrl[i+1],p3=ctrl[min(nSeg,i+2)];
    return [cr(p0[0],p1[0],p2[0],p3[0],t),cr(p0[1],p1[1],p2[1],p3[1],t),0.1*sin(s*4.2)];
  };
  const stemTan=s=>V.norm(V.sub(stemPos(s+0.002),stemPos(s-0.002)));
  const stemR=s=>0.05-0.02*s;
  const frameAt=s=>{const T=stemTan(s);const N=V.norm(V.cross(T,[0,0,1]));const B=V.cross(T,N);return {T,N,B};};

  for(let i=0;i<90;i++){
    const s=(i+rnd())/90, c=stemPos(s), {N,B}=frameAt(s), r=stemR(s);
    for(let j=0;j<8;j++){
      const th=(j+rnd())/8*TAU;
      const n=V.add(V.mul(N,cos(th)),V.mul(B,sin(th)));
      add(V.add(c,V.mul(n,r)),n,CLS.STEM,s*3.2+rnd()*0.12,1,0,-1);
    }
  }

  /* ---------- thorns ---------- */
  for(let i=0;i<7;i++){
    const s=0.13+0.105*i, phi=i*2.5+0.6;
    const c=stemPos(s), {T,N,B}=frameAt(s);
    const out=V.norm(V.add(V.mul(N,cos(phi)),V.mul(B,sin(phi))));
    const base=V.add(c,V.mul(out,stemR(s)*0.7));
    const D=V.norm(V.add(V.mul(out,1.0),V.mul(T,0.3)));
    const Pp=V.norm(V.cross(D,T)), Q=V.cross(D,Pp);
    const L=0.27+rnd()*0.06, r0=0.046;
    const t0=3.5+i*0.26;
    for(let a=0;a<10;a++){
      const u=(a+0.2)/10;
      for(let j=0;j<7;j++){
        const th=(j+rnd())/7*TAU;
        const ring=V.add(V.mul(Pp,cos(th)),V.mul(Q,sin(th)));
        const pos=V.add(V.add(base,V.mul(D,L*u)),V.add(V.mul(T,-0.5*L*u*u),V.mul(ring,r0*pow(1-u,0.85))));
        add(pos,V.norm(V.add(ring,V.mul(D,0.45))),CLS.THORN,t0+u*0.25,1.15,0,-1);
      }
    }
    add(V.add(V.add(base,V.mul(D,L)),V.mul(T,-0.5*L)),D,CLS.THORN,t0+0.3,1.4,1,-1);
  }

  /* ---------- leaves (generic ribbon) ---------- */
  const leafFn=(O,F,up,L,W,droop,fold,ph)=>{
    const Sd=V.norm(V.cross(F,up));
    return (u,v)=>{
      u=max(0,u);
      const sh=leafShape(u)*(1+0.07*sin(u*38+ph));
      const w=W*sh*v;
      return V.add(V.add(V.add(O,V.mul(F,L*u)),V.mul(up,-droop*L*u*u+fold*abs(w)*0.9)),V.mul(Sd,w));
    };
  };
  const leaves=[
    {s:0.30,F:[0.9,0.22,0.35],L:0.58,droop:0.8},
    {s:0.47,F:[-0.9,0.25,-0.3],L:0.52,droop:0.75},
    {s:0.63,F:[0.8,0.2,-0.4],L:0.42,droop:0.7},
    {s:0.17,F:[-0.85,0.1,0.5],L:0.36,droop:0.6}
  ];
  leaves.forEach((lf,idx)=>{
    const fn=leafFn(stemPos(lf.s),V.norm(lf.F),[0,1,0],lf.L,0.18,lf.droop,0.3,idx*1.7);
    surface(fn,18,10,u=>max(0.08,leafShape(u)),(p,n,u,v)=>{
      const dry=u*u*1.1+rnd()*0.22;
      add(p,n,dry>0.62?CLS.LEAFDRY:CLS.LEAF,5.0+idx*0.45+u*0.7,abs(v)<0.08?1.3:1,0,-1);
    });
  });

  /* ---------- bloom frame ---------- */
  const G=stemPos(1);
  const a=qs.has('axis')?V.norm(qs.get('axis').split(',').map(Number)):V.norm([0.6,-0.8,0.45]);
  const e1=V.norm(V.cross(a,[0,0,1])), e2=V.cross(a,e1);
  const toWorld=(lx,ly,lz)=>V.add(V.add(V.add(G,V.mul(e1,lx)),V.mul(a,ly)),V.mul(e2,lz));
  BLOOM_C=V.add(G,V.mul(a,0.22));

  // receptacle
  for(let i=0;i<80;i++){
    const th=rnd()*TAU, ph=acos2(rnd());
    const dir=[sin(ph)*cos(th),cos(ph),sin(ph)*sin(th)];
    const p=V.add(V.add(V.add(V.add(G,V.mul(a,0.05)),V.mul(e1,0.14*dir[0])),V.mul(a,0.11*dir[1])),V.mul(e2,0.14*dir[2]));
    const n=V.norm(V.add(V.add(V.mul(e1,dir[0]),V.mul(a,dir[1])),V.mul(e2,dir[2])));
    add(p,n,CLS.STEM,6.3+rnd()*0.4,0.9,0,-1);
  }
  // sepals
  for(let i=0;i<5;i++){
    const phi=i*TAU/5+0.3, radial=V.add(V.mul(e1,cos(phi)),V.mul(e2,sin(phi)));
    const F=V.norm(V.sub(V.mul(radial,0.9),V.mul(a,0.25)));
    const O=V.add(G,V.mul(a,0.08));
    const fn=leafFn(O,F,a,0.46,0.08,0.5,0.5,i*2.1);
    surface(fn,11,6,u=>max(0.1,leafShape(u)),(p,n,u)=>{
      add(p,n,u>0.8&&rnd()<0.5?CLS.LEAFDRY:CLS.LEAF,6.4+i*0.05+u*0.3,1,0,-1);
    });
  }

  /* ---------- petals ---------- */
  for(let k=0;k<NPET;k++){
    const t=k/(NPET-1);
    const fn=petalFn(k,toWorld);
    const rows=round(11+10*t), nv=round(13+15*t);
    surface(fn,rows,nv,u=>max(0.1,petalShape(u)),(p,n,u,v)=>{
      if(u>0.82 && t>0.45 && rnd()<(u-0.82)*2.4*t) return;      // ragged, torn edges
      const dry=u*u*u*(0.35+t*0.9)+(rnd()-0.5)*0.22;
      const edge=max(max(0,(u-0.84)/0.16),max(0,(abs(v)-0.8)/0.2));
      const ao=(0.5+0.5*sqrt(u))*(0.62+0.38*t)*(0.78+0.95*edge)*(0.82+0.36*((k*0.37)%1));
      add(p,n,dry>0.40?CLS.DRY:CLS.PETAL,7.0+t*6.6+u*0.6+rnd()*0.15,ao,(u>0.92&&rnd()<0.06)?1:0,-1);
    });
  }

  /* ---------- falling petals ---------- */
  for(let j=0;j<4;j++){
    const fn=petalFn(15+j,(x,y,z)=>[x,y,z]);
    const pts=[];
    surface(fn,8,9,u=>max(0.1,petalShape(u)),(p,n)=>pts.push([p,n]));
    const c=pts.reduce((s,q)=>V.add(s,q[0]),[0,0,0]).map(x=>x/pts.length);
    const piece={start:P.x.length,count:pts.length,lp:[],ln:[],t0:16.5+j*2.9,period:11.5+j*0.7,ph:j*1.9,alpha:0};
    pts.forEach(([p,n])=>{
      const lp=V.mul(V.sub(p,c),0.5);
      piece.lp.push(lp);piece.ln.push(n);
      add(lp,n,rnd()<0.25?CLS.DRY:CLS.PETAL,0,0.9,0,j);
    });
    PIECES.push(piece);
  }

}
function acos2(r){return Math.acos(1-2*r)*0.5+0.0}   // hemisphere-ish

/* =========================================================
   typed arrays
   ========================================================= */
let N=0, X,Y,Z,NX,NY,NZ,AO,TA,CLSA,FL,PC, SX,SY,SZ,CELL;
let CX=0,CY=0,CZ=0,RADIUS=1,HEIGHT=1,RXZ=1;
let FLARES=[];
function finalize(){
  N=P.x.length;
  X=Float32Array.from(P.x);Y=Float32Array.from(P.y);Z=Float32Array.from(P.z);
  NX=Float32Array.from(P.nx);NY=Float32Array.from(P.ny);NZ=Float32Array.from(P.nz);
  AO=Float32Array.from(P.ao);TA=Float32Array.from(P.ta);
  CLSA=Uint8Array.from(P.cls);FL=Uint8Array.from(P.fl);PC=Int8Array.from(P.pc);
  SX=new Float32Array(N);SY=new Float32Array(N);SZ=new Float32Array(N);CELL=new Int32Array(N);
  // bounds from the static part only
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,z0=1e9,z1=-1e9;
  for(let i=0;i<N;i++){ if(PC[i]>=0) continue;
    x0=min(x0,X[i]);x1=max(x1,X[i]);y0=min(y0,Y[i]);y1=max(y1,Y[i]);z0=min(z0,Z[i]);z1=max(z1,Z[i]);}
  CX=(x0+x1)/2;CY=(y0+y1)/2;CZ=(z0+z1)/2;
  HEIGHT=y1-y0;
  let r=0,rxz=0;
  for(let i=0;i<N;i++){ if(PC[i]>=0) continue;
    const dx=X[i]-CX,dy=Y[i]-CY,dz=Z[i]-CZ;
    r=max(r,sqrt(dx*dx+dy*dy+dz*dz)); rxz=max(rxz,sqrt(dx*dx+dz*dz));}
  RADIUS=r;RXZ=rxz;
  // sparkle candidates: thorn tips + some petal edges
  FLARES=[];
  for(let i=0;i<N;i++) if(FL[i]) FLARES.push({i,ph:rnd()*TAU,sp:1.2+rnd()*2.2,thorn:CLSA[i]===CLS.THORN});
}

/* dust */

for(let i=0;i<260;i++) DUST.push({

const cv=$('cv'), ctx=cv.getContext('2d',{alpha:false});

let SPR=[], FLARE=null, ATLAS_KEY='';
let ZB=new Float32Array(0), IB=new Int32Array(0);

function makeFlare(){
  const s=96,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.1,'rgba(255,215,225,.75)');
  rg.addColorStop(.4,'rgba(255,90,125,.14)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,s,s);
  const lh=g.createLinearGradient(0,0,s,0);
  lh.addColorStop(0,'rgba(255,255,255,0)');lh.addColorStop(.5,'rgba(255,255,255,.95)');lh.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=lh;g.fillRect(0,s/2-1,s,2);
  const lv=g.createLinearGradient(0,0,0,s);
  lv.addColorStop(0,'rgba(255,255,255,0)');lv.addColorStop(.5,'rgba(255,255,255,.95)');lv.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=lv;g.fillRect(s/2-1,0,2,s);

}

function buildAtlas(){
  const key=GS+'@'+DPR;
  if(key===ATLAS_KEY) return;
  ATLAS_KEY=key;
  const size=Math.ceil(GS*DPR*1.5);
  const vt=!!(document.fonts&&document.fonts.check("16px 'VT323'"));
  const fontPx=GS*DPR*(vt?1.6:1.08);
  SPR=[];
  for(let c=0;c<NCLS;c++){
    for(let l=0;l<LV;l++){
      const b=l/(LV-1), col=rampColor(RAMPS[c],pow(b,0.9));
      for(let v=0;v<2;v++){
        const cn=document.createElement('canvas');cn.width=cn.height=size;
        const g=cn.getContext('2d');
        g.font=`${fontPx}px 'VT323', ui-monospace, Menlo, monospace`;
        g.textAlign='center';g.textBaseline='middle';
        g.fillStyle=`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;
        const ch=(v?CHARS_B:CHARS_A)[l];
        g.fillText(ch,size/2,size/2+size*0.02);
        SPR.push(cn);
      }
    }
  }

}

function resize(){
  const r=cv.getBoundingClientRect();
  DPR=min(2,window.devicePixelRatio||1);
  W=max(2,round(r.width*DPR));H=max(2,round(r.height*DPR));
  cv.width=W;cv.height=H;
  const css=min(r.width,r.height*0.95);
  GS=max(5.4,min(11,round((css*0.0125+0.9)*10)/10));
  if(qs.has('gs')) GS=parseFloat(qs.get('gs'));
  const sH=(H*0.86)/HEIGHT, sW=(W*0.98)/(2*RXZ*0.9);
  SC=min(sH,sW);
  CELLPX=GS*DPR*0.8;
  COLS=Math.ceil(W/CELLPX)+1;ROWS=Math.ceil(H/CELLPX)+1;
  ZB=new Float32Array(COLS*ROWS);IB=new Int32Array(COLS*ROWS);
  buildAtlas();
}

/* =========================================================
   renderer
   ========================================================= */
const KEY=V.norm([-0.35,0.75,0.85]);
const HALF=V.norm(V.add(KEY,[0,0,1]));
const D_CAM=7.5, TILT=0.16;
let lastLetters=0,lastGlints=0,lastAng=0;

function updatePieces(t){
  for(const pc of PIECES){
    if(t<pc.t0){pc.alpha=0;continue;}
    const p=((t-pc.t0)%pc.period)/pc.period;
    const FALL=0.62;
    const q=min(1,p/FALL);
    let alpha=1;
    if(p<0.04) alpha=p/0.04;
    if(p>0.88) alpha=max(0,1-(p-0.88)/0.12);
    pc.alpha=alpha;
    const j=pc.ph;
    const ease=pow(q,1.45);
    const ox=BLOOM_C[0]+0.28*sin(q*4.6+j)+0.22*q*(sin(j)>0?1:-1);
    const oy=BLOOM_C[1]+(FLOOR_Y+0.05-BLOOM_C[1])*ease;
    const oz=BLOOM_C[2]+0.26*cos(q*3.8+j*1.7);
    const tum=(1-ease*0.85);
    const ax=j*1.3+q*5.5*tum+1.1, ay=j+q*4.2*tum, az=q*3.2*tum+0.4;
    // rotation matrix Rz*Ry*Rx
    const cx=cos(ax),sx=sin(ax),cy=cos(ay),sy=sin(ay),cz=cos(az),sz=sin(az);
    const m00=cz*cy, m01=cz*sy*sx-sz*cx, m02=cz*sy*cx+sz*sx;
    const m10=sz*cy, m11=sz*sy*sx+cz*cx, m12=sz*sy*cx-cz*sx;
    const m20=-sy,   m21=cy*sx,           m22=cy*cx;
    for(let k=0;k<pc.count;k++){
      const i=pc.start+k, lp=pc.lp[k], ln=pc.ln[k];
      X[i]=ox+m00*lp[0]+m01*lp[1]+m02*lp[2];
      Y[i]=oy+m10*lp[0]+m11*lp[1]+m12*lp[2];
      Z[i]=oz+m20*lp[0]+m21*lp[1]+m22*lp[2];
      NX[i]=m00*ln[0]+m01*ln[1]+m02*ln[2];
      NY[i]=m10*ln[0]+m11*ln[1]+m12*ln[2];
      NZ[i]=m20*ln[0]+m21*ln[1]+m22*ln[2];
    }
  }
}

function render(t,dt){
  const ang=qs.has('ang')?parseFloat(qs.get('ang')):0.3*t+0.4;
  lastAng=ang;
  const ca=cos(ang),sa=sin(ang),ct=cos(TILT),st=sin(TILT);
  const cx=W*0.5, cy=H*0.5+sin(t*0.9)*SC*0.008;
  updatePieces(t);

  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  ZB.fill(-1e9);IB.fill(-1);
  const flashFront=[];
  for(let i=0;i<N;i++){
    const age=t-TA[i];
    if(age<0) continue;
    const pcid=PC[i];
    if(pcid>=0 && PIECES[pcid].alpha<0.04) continue;
    const x=X[i]-CX,y=Y[i]-CY,z=Z[i]-CZ;
    const rx=x*ca+z*sa, rz=-x*sa+z*ca;
    const ty=y*ct-rz*st, tz=y*st+rz*ct;
    const pers=D_CAM/(D_CAM-tz);
    const sx=cx+rx*pers*SC, sy=cy-ty*pers*SC;
    SX[i]=sx;SY[i]=sy;SZ[i]=tz;
    const col=(sx/CELLPX)|0,row=(sy/CELLPX)|0;
    if(col<0||row<0||col>=COLS||row>=ROWS){CELL[i]=-1;continue;}
    const c=row*COLS+col;CELL[i]=c;
    if(tz>ZB[c]){ZB[c]=tz;IB[c]=i;}
    if(age<0.07 && (i%6===0) && flashFront.length<10) flashFront.push(i);
  }

  // draw winners
  let letters=0, glints=0;
  const rimA=t*0.9, rim=[cos(rimA),0.5,sin(rimA)], rimN=V.norm(rim);
  const total=COLS*ROWS;
  for(let c=0;c<total;c++){
    const i=IB[c]; if(i<0) continue;
    const x=NX[i],y=NY[i],z=NZ[i];
    // rotate normal
    let nx=x*ca+z*sa, nz=-x*sa+z*ca, ny=y;
    const ny2=ny*ct-nz*st, nz2=ny*st+nz*ct;
    nx=nx; ny=ny2; nz=nz2;
    if(nz<0){nx=-nx;ny=-ny;nz=-nz;}
    const diff=max(0,nx*KEY[0]+ny*KEY[1]+nz*KEY[2]);
    const rimD=max(0,nx*rimN[0]+ny*rimN[1]+nz*rimN[2]);
    const sp=pow(max(0,nx*HALF[0]+ny*HALF[1]+nz*HALF[2]),26);
    const depth=(SZ[i]/RADIUS+1)*0.5;
    let b=(0.2+0.62*diff+0.38*rimD*rimD+0.55*sp)*AO[i]*(0.74+0.34*depth);
    b*= 0.9+0.2*((i*2654435761>>>0)/4294967296);
    let cls=CLSA[i];
    const age=t-TA[i];
    if(age<0.26){cls=CLS.FLASH;b=0.55+0.45*(1-age/0.26);}
    if(PC[i]>=0) b*=PIECES[PC[i]].alpha;
    let lvl=round(pow(min(1,b),0.8)*(LV-1));
    if(lvl<1) continue;
    if(lvl>=LV-2) glints++;
    const pers=D_CAM/(D_CAM-SZ[i]);
    const sz=SPR[0].width*(0.9+0.2*pers)/ (1) ;
    const dx=SX[i]-sz/2, dy=SY[i]-sz/2;
    ctx.drawImage(SPR[((cls*LV)+lvl)*2+(i&1)],dx|0,dy|0,sz|0,sz|0);
    letters++;
  }

  // dust
  for(const d of DUST){
    if(t<d.ta) continue;
    d.y+=d.vy*dt; if(d.y>1.4) d.y=-1.95;
    const x=d.x-CX,y=d.y-CY,z=d.z-CZ;
    const rx=x*ca+z*sa, rz=-x*sa+z*ca;
    const ty=y*ct-rz*st, tz=y*st+rz*ct;
    const pers=D_CAM/(D_CAM-tz);
    const sx=cx+rx*pers*SC, sy=cy-ty*pers*SC;
    const tw=max(0,sin(t*d.sp+d.ph));
    const lvl=1+((tw*tw)*4|0);
    if(tw>0.35) glints++;
    const spr=SPR[((CLS.DUST*LV)+lvl)*2+(lvl&1)];
    ctx.drawImage(spr,(sx-spr.width/2)|0,(sy-spr.height/2)|0);
  }

  // flares (glints)
  ctx.globalCompositeOperation='lighter';
  const drawFlare=(i,inten,size)=>{
    ctx.globalAlpha=min(1,inten);
    const s=size*DPR;
    ctx.drawImage(FLARE,SX[i]-s/2,SY[i]-s/2,s,s);
  };
  const visible=i=>{const c=CELL[i];return c>=0 && SZ[i]>=ZB[c]-0.14;};
  for(const f of FLARES){
    const i=f.i; if(t<TA[i]) continue;
    if(!visible(i)) continue;
    const tw=pow(max(0,sin(t*f.sp+f.ph)),7);
    const inten=(f.thorn?0.25:0.0)+tw*(f.thorn?0.95:0.8);
    if(inten<0.05) continue;
    drawFlare(i,inten,(f.thorn?30:24)*(0.5+tw*0.8));
    glints++;
  }
  for(const i of flashFront){ if(visible(i)) drawFlare(i,0.9,34); }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

  lastLetters=letters;lastGlints=glints;
}

const FULL=SECTIONS.map(s=>s.src).join('');
const LINES=FULL.split('\n');
const LINE_START=[];{let o=0;LINES.forEach(l=>{LINE_START.push(o);o+=l.length+1;});}

const KW=new Set(['import','as','def','for','in','return','if','else','from','class','while','not','and','or']);
const BI=new Set(['range','int','len','max','min','sum','abs']);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(line){
  const re=/(#.*)|("[^"]*"|'[^']*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z_0-9]*\b)|(\s+|.)/g;
  let out='',m,prevDef=false;
  while((m=re.exec(line))){
    if(m[1]) out+=`<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="n">${m[3]}</span>`;
    else if(m[4]){
      const w=m[4];
      if(prevDef){out+=`<span class="f">${w}</span>`;prevDef=false;}
      else if(KW.has(w)){out+=`<span class="k">${w}</span>`;prevDef=(w==='def'||w==='class');}
      else if(BI.has(w)) out+=`<span class="b">${w}</span>`;
      else if(/^[A-Z][A-Z_0-9]+$/.test(w)) out+=`<span class="u">${w}</span>`;
      else out+=w;
    } else out+=esc(m[5]);
  }
  return out;
}
// highlight only the typed prefix of a line, keeping colours stable
function hlPartial(line,n){
  const full=hl(line);
  if(n>=line.length) return full;
  // re-tokenise the prefix (cheap, lines are short)
  return hl(line.slice(0,n));
}

const linesEl=$('lines');
let lineEls=[],lineDone=[];
function typedCount(t){
  let c=0;
  for(const s of SECTIONS){
    const len=s.src.length;
    if(t>=s.t1) c+=len;
    else if(t>s.t0) c+=floor((t-s.t0)/(s.t1-s.t0)*len);
  }
  return c;
}
let lastCount=-1;
function updateCode(t){
  const count=min(FULL.length,typedCount(t));
  if(count===lastCount) return;
  lastCount=count;
  let li=0;
  while(li+1<LINES.length && LINE_START[li+1]<=count) li++;
  const col=count-LINE_START[li];
  // grow
  while(lineEls.length<=li){
    const d=document.createElement('div');d.className='ln';
    d.innerHTML=`<i>${lineEls.length+1}</i><span class="tx"></span>`;
    linesEl.appendChild(d);lineEls.push(d);lineDone.push(false);
  }
  while(lineEls.length>li+1){linesEl.removeChild(lineEls.pop());lineDone.pop();}
  for(let j=0;j<li;j++){
    if(!lineDone[j]){lineEls[j].querySelector('.tx').innerHTML=hl(LINES[j])||' ';lineDone[j]=true;}
    lineEls[j].classList.remove('cur');
  }
  lineDone[li]=false;
  const el=lineEls[li];el.classList.add('cur');
  const done=count>=FULL.length;
  el.querySelector('.tx').innerHTML=hlPartial(LINES[li],col)+(done?'':'<span class="caret"></span>')||' ';
}

const Music=(()=>{
  let ctx=null,master=null,bus=null,timer=null,nextT=0,step=0,started=false,muted=false,el=null,melIdx=4;
  const STEP=0.64;

    {bass:41,pad:[57,60,64,69]},   // Fmaj7

    const len=floor(c.sampleRate*sec),buf=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*pow(1-i/len,decay);}

  function init(){

    master=ctx.createGain();master.gain.value=0;
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
    master.connect(comp);comp.connect(ctx.destination);

    const dry=ctx.createGain();dry.gain.value=0.75;bus.connect(dry);dry.connect(master);
    const conv=ctx.createConvolver();conv.buffer=makeIR(ctx,3.6,2.6);
    const wet=ctx.createGain();wet.gain.value=0.6;bus.connect(conv);conv.connect(wet);wet.connect(master);
    const dl=ctx.createDelay(2);dl.delayTime.value=0.48;

    const dw=ctx.createGain();dw.gain.value=0.32;
    bus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(dw);dw.connect(master);
  }
  function pad(f,t,dur){
    const g=ctx.createGain(),lp=ctx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=1000;lp.Q.value=0.3;

    g.gain.linearRampToValueAtTime(0.042,t+2.3);
    g.gain.setValueAtTime(0.042,t+dur-2.4);

    [['triangle',-7],['sine',6]].forEach(([type,det])=>{
      const o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;
      o.connect(lp);o.start(t);o.stop(t+dur+0.1);
    });

  }
  function bass(f,t,dur){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.11,t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.1);
  }
  function bell(f,t,vel){
    const g=ctx.createGain(),pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
    [[1,1],[2,0.28],[3.01,0.07],[5.4,0.025]].forEach(([m,a])=>{
      const o=ctx.createOscillator(),og=ctx.createGain();
      o.type='sine';o.frequency.value=f*m;og.gain.value=a;
      o.connect(og);og.connect(g);o.start(t);o.stop(t+2.7);
    });
    if(pan){pan.pan.value=(Math.random()*2-1)*0.55;g.connect(pan);pan.connect(bus);}else g.connect(bus);
  }
  function schedule(){
    while(nextT<ctx.currentTime+1.3){
      const inChord=step%8, ci=floor(step/8)%4, ch=CHORDS[ci];
      if(inChord===0){
        const dur=STEP*8+2.2;
        ch.pad.forEach(m=>pad(midi(m),nextT,dur));
        bass(midi(ch.bass),nextT,STEP*7);
        bass(midi(ch.bass+12),nextT+STEP*4,STEP*3.5);
      }
      const p=(inChord%2===0)?0.66:0.26;
      if(Math.random()<p){
        const jump=Math.random()<0.18;
        melIdx=max(0,min(MEL.length-1,melIdx+(jump?(Math.random()<0.5?-3:3):[-1,1,-1,1,-2,2][floor(Math.random()*6)])));
        bell(midi(MEL[melIdx]),nextT+Math.random()*0.03,0.05+Math.random()*0.05);
      }
      nextT+=STEP;step++;
    }
  }
  return {
    start(){
      if(started) return;
      started=true;
      if(CONFIG.audioFile){
        el=new Audio(CONFIG.audioFile);el.loop=true;el.volume=CONFIG.volume;
        el.play().catch(()=>{});return;
      }
      try{
        init();
        if(ctx.state==='suspended') ctx.resume();
        nextT=ctx.currentTime+0.2;
        schedule();timer=setInterval(schedule,120);
        master.gain.setValueAtTime(0,ctx.currentTime);
        master.gain.linearRampToValueAtTime(muted?0:CONFIG.volume,ctx.currentTime+4);
      }catch(e){console.warn('audio unavailable',e);}
    },
    setMuted(m){
      muted=m;
      if(el){el.muted=m;return;}
      if(master) master.gain.cancelScheduledValues(ctx.currentTime),
                 master.gain.linearRampToValueAtTime(m?0:CONFIG.volume,ctx.currentTime+0.6);
    },
    pause(){ if(ctx&&ctx.state==='running') ctx.suspend(); if(el) el.pause(); },
    resume(){ if(ctx&&ctx.state==='suspended') ctx.resume(); if(el&&started) el.play().catch(()=>{}); },
    get started(){return started;}
  };
})();

/* =========================================================
   main loop
   ========================================================= */
let running=false,t0=0,lastNow=0,fpsAcc=0,fpsN=0,hudT=0;
const hT=$('hT'),hR=$('hR'),hG=$('hG'),hL=$('hL'),hF=$('hF');
const fmt=n=>n.toLocaleString('en-US');

function frame(now){
  requestAnimationFrame(frame);
  if(!running) return;
  const dt=min(0.1,(now-lastNow)/1000);lastNow=now;
  const t=(now-t0)/1000;
  render(t,dt);
  updateCode(t);
  fpsAcc+=dt;fpsN++;
  hudT+=dt;
  if(hudT>0.1){
    hudT=0;
    hT.textContent='t '+t.toFixed(2).padStart(5,'0')+'s';
    const deg=((lastAng*180/PI)%360+360)%360;
    hR.textContent=deg.toFixed(2).padStart(6,'0')+'°';
    hG.textContent=fmt(lastGlints);
    hL.textContent=fmt(lastLetters);
    if(fpsAcc>0.5){hF.textContent=round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;}
  }
}

function start(skip=0){
  running=true;
  t0=performance.now()-skip*1000;lastNow=performance.now();
  lastCount=-1;
  $('gate').classList.add('off');
  if(!skip) Music.start();
}
function replay(){
  lastCount=-1;lineEls.forEach(e=>e.remove());lineEls=[];lineDone=[];
  t0=performance.now();
}

async function boot(){
  $('hH').textContent=CONFIG.handle+' / '+CONFIG.year;
  $('hS').textContent=CONFIG.script;$('gS').textContent=CONFIG.script;
  build();finalize();
  try{ await Promise.race([Promise.all([document.fonts.load("16px 'VT323'"),document.fonts.load("8px 'Press Start 2P'")]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  resize();
  new ResizeObserver(()=>{resize();}).observe($('stage'));
  window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  requestAnimationFrame(frame);

  $('go').addEventListener('click',()=>start());
  $('rep').addEventListener('click',()=>{if(running)replay();});
  const snd=$('snd');
  snd.addEventListener('click',()=>{
    const m=snd.getAttribute('aria-pressed')!=='true';
    snd.setAttribute('aria-pressed',m);snd.textContent=m?'snd off':'snd on';
    Music.setMuted(m);
  });
  window.addEventListener('keydown',e=>{
    if(e.key==='m'||e.key==='M') snd.click();
    else if(e.key==='r'||e.key==='R') $('rep').click();
    else if((e.key==='Enter'||e.key===' ')&&!running){e.preventDefault();start();}
  });
  document.addEventListener('visibilitychange',()=>{document.hidden?Music.pause():Music.resume();});
  if(qs.has('t')) start(parseFloat(qs.get('t'))||0);   // ?t=12 jumps ahead (handy for previews)
  $('go').focus({preventScroll:true});
}
boot();
})();
